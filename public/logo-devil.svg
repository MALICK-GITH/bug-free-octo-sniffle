<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="devilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42f56c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#devilGradient)" opacity="0.1"/>
  
  <!-- Devil emoji 😈 -->
  <text x="256" y="340" 
        font-size="280" 
        text-anchor="middle" 
        filter="url(#glow)"
        style="font-family: Arial, sans-serif;">
    😈
  </text>
  
  <!-- Brand text -->
  <text x="256" y="420" 
        font-size="32" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#42f56c"
        style="font-family: 'Chakra Petch', sans-serif; letter-spacing: 2px;">
    SOLITAIRE HACK
  </text>
</svg>
